---
# GitLab CI pipeline publishing the test-infra-definitions app images
# (apps/*/images/*) to the agent-qa ECR registry
# (669783387624.dkr.ecr.us-east-1.amazonaws.com).
#
# This is the GitLab counterpart of .github/workflows/docker-publish.yml, which
# publishes the same images to ghcr.io and is kept unchanged. Both pipelines
# build linux/amd64 + linux/arm64 images with the same tags and the same
# org.opencontainers.image.* labels:
#
#   - push to the default branch: <branch> and latest
#     (e.g. apps-dogstatsd:main, apps-dogstatsd:latest)
#   - push of a vX.Y.Z tag:      vX.Y.Z and latest
#     (e.g. apps-dogstatsd:v0.0.7, apps-dogstatsd:latest)
#   - an extra immutable <pipeline id>-<short sha> tag is added for
#     traceability, following the agent-qa image conventions.
#
# The publishing itself is done through the `dd-pkg` tool from the
# public-images repository, like for the Agent images (see
# datadog-agent/.gitlab/.pre/common/container_publish_job_templates.yml and
# datadog-agent/.gitlab/deploy/dev_container_deploy/e2e.yml):
#   1. each image is built per architecture and pushed to the internal CI
#      registry (registry.ddbuild.io/ci/test-infra-definitions),
#   2. the arch images are merged into a multi-arch manifest and pushed to
#      agent-qa with `dd-pkg publish-image`.
#
# NOTE: the destination ECR repositories (apps-<image>, redis, ...) must exist
# in the agent-qa account before the first push.

stages:
  - container_build
  - container_publish

variables:
  # CI images, referenced exactly like in the datadog-agent repository
  # (.gitlab/deploy/container_build/docker_linux.yml). The CI_IMAGE_* values
  # are normally provided by CI variables (as in datadog-agent); the ones
  # below are only fallbacks, as YAML-defined variables have the lowest
  # precedence in GitLab and are overridden by project/group CI variables.
  CI_IMAGE_DOCKER_X64_SUFFIX: ""
  CI_IMAGE_DOCKER_ARM64_SUFFIX: ""
  CI_IMAGE_DOCKER_X64: v107034079-0ba6ff53
  CI_IMAGE_DOCKER_ARM64: v107034079-0ba6ff53
  # Image containing the dd-pkg tool (public-images repository)
  DD_PKG_IMAGE: registry.ddbuild.io/agent-delivery/dd-pkg@sha256:316a4ad7eba06e7db4c2ddc490d7ee61bd10a95c6c89bbf97c41ceec4b003701
  # Internal CI registry where the per-arch images are staged before publishing
  SRC_REGISTRY: registry.ddbuild.io/ci/test-infra-definitions
  PUBLIC_IMAGES_PUBLISH_TIMEOUT: "1800"

workflow:
  rules:
    # Don't run for merge requests: the GitHub workflow already builds PRs
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Test tags (ci-test-*): used to try the full pipeline from a branch
    # without touching `latest`. They deliberately don't match the v*.*.*
    # glob of the GitHub workflow, so nothing is published to ghcr.io.
    - if: "$CI_COMMIT_TAG =~ /^ci-test-/"
    # Publish on vX.Y.Z tags, like the GitHub workflow
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    # Publish on the default branch
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

# Same path filters as .github/workflows/docker-publish.yml
# (the hidden job is only an anchor holder)
.app_images_rules:
  rules:
    &app_images_rules # Test tags (ci-test-*): full pipeline without updating `latest`
    - if: "$CI_COMMIT_TAG =~ /^ci-test-/"
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - .gitlab-ci.yml
        - .github/workflows/docker-publish.yml
        - apps/*/images/**
    - when: never

# Images built by this pipeline and by .github/workflows/docker-publish.yml.
# REPO is the image name without registry, identical to the name published on
# ghcr.io by the GitHub workflow.
.app_images: &app_images
  parallel:
    matrix:
      - APP: dogstatsd
        IMAGE_DIR: dogstatsd
        REPO: apps-dogstatsd
      - APP: mutatedbyadmissioncontroller
        IMAGE_DIR: mutated
        REPO: apps-mutated
      - APP: nginx
        IMAGE_DIR: http-client
        REPO: apps-http-client
      - APP: nginx
        IMAGE_DIR: nginx-server
        REPO: apps-nginx-server
      - APP: prometheus
        IMAGE_DIR: prometheus
        REPO: apps-prometheus
      - APP: redis
        IMAGE_DIR: redis-client
        REPO: apps-redis-client
      # Must be named exactly `redis` for the integrations-core redisdb
      # auto-discovery, see .github/workflows/docker-publish.yml
      - APP: redis
        IMAGE_DIR: redis-server
        REPO: redis
      - APP: cpustress
        IMAGE_DIR: stress-ng
        REPO: apps-stress-ng
      - APP: tracegen
        IMAGE_DIR: tracegen
        REPO: apps-tracegen
      - APP: npm-tools
        IMAGE_DIR: go-httpbin
        REPO: apps-go-httpbin
      - APP: npm-tools
        IMAGE_DIR: npm-tools
        REPO: apps-npm-tools
      - APP: cws
        IMAGE_DIR: cws-centos7
        REPO: apps-cws-centos7
      - APP: logger
        IMAGE_DIR: logger
        REPO: apps-logger
      - APP: jmxfetch
        IMAGE_DIR: jmx-test-app
        REPO: apps-jmx-test-app
      - APP: fips
        IMAGE_DIR: fips-server
        REPO: apps-fips-server
      - APP: otel
        IMAGE_DIR: calendar-go
        REPO: apps-calendar-go
      - APP: gpu
        IMAGE_DIR: cuda-basic
        REPO: apps-cuda-basic
      - APP: s3-proxy-nginx
        IMAGE_DIR: s3-proxy-nginx
        REPO: apps-s3-proxy-nginx
      - APP: etcd
        IMAGE_DIR: alpine
        REPO: apps-alpine
      - APP: churn
        IMAGE_DIR: churn
        REPO: apps-churn

.docker_build:
  <<: *app_images
  stage: container_build
  rules: *app_images_rules
  timeout: 30m
  retry: 2
  variables:
    ARCH: amd64
  script:
    - BUILD_CONTEXT="apps/${APP}/images/${IMAGE_DIR}"
    - SOURCE_TAG="${SRC_REGISTRY}/${REPO}:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-${ARCH}"
    - CACHE_TAG="${SRC_REGISTRY}/${REPO}:cache-${ARCH}"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        export IMAGE_VERSION="${CI_COMMIT_TAG}"
      else
        export IMAGE_VERSION="${CI_COMMIT_REF_SLUG}"
      fi
    - |
      set -euo pipefail
      # Labels mirroring the ones set by docker/metadata-action in
      # .github/workflows/docker-publish.yml
      docker buildx build --pull --platform "linux/${ARCH}" \
        --cache-from "type=registry,ref=${CACHE_TAG}" \
        --cache-to "type=registry,ref=${CACHE_TAG},mode=max" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
        --label "org.opencontainers.image.description=" \
        --label "org.opencontainers.image.licenses=" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=https://github.com/DataDog/test-infra-definitions" \
        --label "org.opencontainers.image.title=test-infra-definitions" \
        --label "org.opencontainers.image.url=https://github.com/DataDog/test-infra-definitions" \
        --label "org.opencontainers.image.version=${IMAGE_VERSION}" \
        --output "type=image,push=true,oci-mediatypes=false,compression=gzip,force-compression=true" \
        --tag "${SOURCE_TAG}" \
        --file "${BUILD_CONTEXT}/Dockerfile" \
        "${BUILD_CONTEXT}"

docker_build_amd64:
  extends: .docker_build
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_x64$CI_IMAGE_DOCKER_X64_SUFFIX:$CI_IMAGE_DOCKER_X64
  tags: ["arch:amd64"]
  variables:
    ARCH: amd64

docker_build_arm64:
  extends: .docker_build
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/docker_arm64$CI_IMAGE_DOCKER_ARM64_SUFFIX:$CI_IMAGE_DOCKER_ARM64
  tags: ["arch:arm64"]
  variables:
    ARCH: arm64

# Merge the per-arch images into multi-arch manifests and publish them to the
# agent-qa ECR registry with dd-pkg (public-images repository).
.docker_publish_agent_qa:
  image: $DD_PKG_IMAGE
  tags: ["arch:amd64"]
  stage: container_publish
  dependencies: []
  variables:
    IMG_REGISTRIES: agent-qa
    IMG_SIGNING: "false"
  before_script:
    - |
      set -euo pipefail
      SRC_BASE_TAG="${SRC_REGISTRY}/${REPO}:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
      export IMG_SOURCES="${SRC_BASE_TAG}-amd64,${SRC_BASE_TAG}-arm64"
      # Tags mirroring the docker/metadata-action behaviour of the GitHub
      # workflow: branch/tag name + latest, plus an immutable CI tag.
      # `latest` is only published for production semver tags and on the
      # default branch, never for ci-test-* tags.
      export IMG_TAGS="${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        export IMG_TAGS="${CI_COMMIT_TAG} ${IMG_TAGS}"
      else
        export IMG_TAGS="${CI_COMMIT_REF_SLUG} ${IMG_TAGS}"
      fi
      if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ] || [[ "${CI_COMMIT_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        export IMG_TAGS="${IMG_TAGS} latest"
      fi
  script:
    - |
      set -euo pipefail
      dd-pkg version
      for TAG in ${IMG_TAGS}; do
        echo ">>> Publishing ${REPO}:${TAG} to ${IMG_REGISTRIES}"
        dd-pkg publish-image \
          --timeout "${PUBLIC_IMAGES_PUBLISH_TIMEOUT}" \
          --poll-interval 30 \
          --signing "${IMG_SIGNING}" \
          --registries "${IMG_REGISTRIES}" \
          --sources "${IMG_SOURCES}" \
          --destinations "${REPO}:${TAG}"
      done

publish_agent_qa:
  extends: .docker_publish_agent_qa
  <<: *app_images
  rules: *app_images_rules
  # Worst case: 3 tags x 30min dd-pkg timeout
  timeout: 2h
  needs:
    - docker_build_amd64
    - docker_build_arm64
